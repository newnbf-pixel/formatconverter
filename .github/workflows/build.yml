name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: universal-converter-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل ملفاتي من المستودع
        uses: actions/checkout@v4
        with:
          path: my_files

      - name: تجهيز Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إنشاء هيكل تطبيق Flutter كامل (android/ios) تلقائيًا
        run: flutter create --platforms=android app

      - name: تحديث إعدادات Android للحزم الحالية
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' app/android/app/build.gradle
          sed -i '/compileSdk = 35/a\    ndkVersion = "26.1.10909125"' app/android/app/build.gradle
          sed -i -E 's/com.android.application" version "[^"]+/com.android.application" version "8.6.1/' app/android/settings.gradle
          sed -i -E 's/org.jetbrains.kotlin.android" version "[^"]+/org.jetbrains.kotlin.android" version "1.9.24/' app/android/settings.gradle
          sed -i -E "s/(kotlin_version[[:space:]]*=[[:space:]]*['\"])[^'\"]+/\11.9.24/" app/android/build.gradle || true
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.7-all.zip#' app/android/gradle/wrapper/gradle-wrapper.properties

      - name: نسخ الكود وتطبيع أسماء ملفات Dart
        run: |
          cp my_files/pubspec.yaml app/pubspec.yaml
          mkdir -p app/lib/converters
          if test -f my_files/lib/main.dart; then cp my_files/lib/main.dart app/lib/main.dart; else cp "$(find my_files -maxdepth 2 -type f -name '*main.dart*' -print -quit)" app/lib/main.dart; fi
          if test -f my_files/lib/converters/mht_to_pdf.dart; then cp my_files/lib/converters/mht_to_pdf.dart app/lib/converters/mht_to_pdf.dart; else find my_files -type f -name '*mht_to_pdf.dart*' -size +10c -exec cp {} app/lib/converters/mht_to_pdf.dart \; -quit; fi
          if test -f my_files/lib/converters/text_converter.dart; then cp my_files/lib/converters/text_converter.dart app/lib/converters/text_converter.dart; else find my_files -type f -name '*text_converter.dart*' -size +10c -exec cp {} app/lib/converters/text_converter.dart \; -quit; fi
          if test -f my_files/lib/converters/image_converter.dart; then cp my_files/lib/converters/image_converter.dart app/lib/converters/image_converter.dart; else find my_files -type f -iname '*image_converter.dart*' -size +10c -exec cp {} app/lib/converters/image_converter.dart \; -quit; fi

      - name: تنزيل الحزم
        working-directory: app
        run: flutter pub get

      - name: بناء ملف APK
        working-directory: app
        run: flutter build apk --release --build-number "${{ github.run_number }}"

      - name: رفع ملف APK كنتيجة نهائية
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: نشر رابط تنزيل مباشر ثابت
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          target_commitish: main
          files: app/build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
          generate_release_notes: false
