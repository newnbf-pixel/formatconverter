name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل ملفاتي من المستودع
        uses: actions/checkout@v4
        with:
          path: my_files

      - name: تجهيز Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: إنشاء هيكل تطبيق Flutter كامل (android/ios) تلقائيًا
        run: flutter create --platforms=android app

      - name: تحديث إعدادات Android للحزم الحالية
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' app/android/app/build.gradle
          sed -i -E 's/(org.jetbrains.kotlin.android" version ")[^"]+/\11.9.24/' app/android/settings.gradle
          sed -i -E "s/(kotlin_version[[:space:]]*=[[:space:]]*['\"])[^'\"]+/\11.9.24/" app/android/build.gradle || true

      - name: نسخ الكود وتطبيع أسماء ملفات Dart
        run: |
          cp my_files/pubspec.yaml app/pubspec.yaml
          mkdir -p app/lib/converters
          main_file=$(find my_files -maxdepth 2 -type f -name '*main.dart*' -print -quit)
          cp "$main_file" app/lib/main.dart
          find my_files -type f -name '*mht_to_pdf.dart*' -exec cp {} app/lib/converters/mht_to_pdf.dart \;
          find my_files -type f -name '*text_converter.dart*' -exec cp {} app/lib/converters/text_converter.dart \;
          find my_files -type f -iname '*image_converter.dart*' -size +10c -exec cp {} app/lib/converters/image_converter.dart \;

      - name: تنزيل الحزم
        working-directory: app
        run: flutter pub get

      - name: بناء ملف APK
        working-directory: app
        run: flutter build apk --release

      - name: رفع ملف APK كنتيجة نهائية
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: نشر رابط تنزيل مباشر ثابت
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          target_commitish: main
          files: app/build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
          generate_release_notes: false
